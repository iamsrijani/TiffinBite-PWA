<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyBite - Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      color: white;
      font-family: -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    .icon { font-size: 80px; margin-bottom: 1.5rem; }
    h1 { font-size: 24px; color: #ff6b35; margin-bottom: 1rem; }
    p { font-size: 15px; color: #888; line-height: 1.6; margin-bottom: 2rem; }
    button {
      background: #ff6b35;
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="icon">🍱</div>
  <h1>You're Offline</h1>
  <p>No internet connection found.<br>Please check your connection and try again.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
